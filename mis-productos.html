<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis productos · Vitrina Emprende</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/local.js"></script>
  <script defer src="js/firebase.js"></script>
  <script defer src="js/datos.js"></script>
  <script defer src="js/asistente.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/mis-productos.js"></script>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>
  <noscript><p style="padding:16px;background:#F8DEDB;color:#B3261E">Activa JavaScript en tu navegador para usar Vitrina Emprende.</p></noscript>
  <div class="banda-demo" id="modo-demo" hidden>Modo demostración: los datos se guardan solo en este navegador.</div>

  <header class="encabezado">
    <div class="contenedor barra">
      <a class="marca" href="index.html"><img src="img/logo.svg" alt=""><span>Vitrina Emprende</span></a>
      <form class="buscador" id="buscador" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="solo-lector">Buscar productos</label>
        <input id="q" type="search" placeholder="Busca brownies, aretes, polos…" autocomplete="off">
      </form>
      <nav class="acciones" id="acciones" aria-label="Cuenta"></nav>
    </div>
  </header>

  <main id="principal" tabindex="-1" class="contenedor" style="max-width:820px">
    <div class="perfil">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div>
        <h1 id="nombre-usuario"></h1>
        <span class="nota" id="carrera-usuario"></span>
      </div>
    </div>

    <div class="resumen" aria-label="Resumen de mis productos">
      <div><strong id="n-publicados">0</strong>publicados</div>
      <div><strong id="n-disponibles">0</strong>disponibles</div>
      <div><strong id="n-agotados">0</strong>agotados</div>
    </div>

    <div class="fila-botones no-imprimir" style="margin-bottom:12px">
      <button class="boton" type="button" id="exportar-csv">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        Descargar reporte Excel (CSV)
      </button>
      <button class="boton" type="button" id="imprimir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
        Imprimir o guardar PDF
      </button>
    </div>
    <p class="solo-impresion" id="encabezado-reporte"></p>

    <div class="lista" id="lista"></div>

    <div class="fila-botones no-imprimir" style="margin-bottom:32px">
      <a class="boton principal grande" href="publicar.html">Publicar otro producto</a>
      <button class="boton" type="button" id="salir">Cerrar sesión</button>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">Vitrina Emprende · Proyecto EFSRT · Escuela de Educación Superior Cibertec.</div>
  </footer>
</body>
</html>
